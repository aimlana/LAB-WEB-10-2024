<!-- HTML Document -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackJack</title>

    <!-- Link Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Link Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid game-area">
        <!-- Navbar Player Money -->
        <nav class="navbar navbar-expand-lg navbar-light fixed-top">
            <div class="container-fluid">
                <div class="collapse navbar-collapse">
                    <!-- Your Money di sebelah kiri atas -->
                    <p class="money-box">Your Money: $<span id="balance">0</span></p>
                </div>
            </div>
        </nav>

        <!-- Player and Dealer area -->
        <div class="container player-area">
            <div class="row justify-content-center align-items-center">
                <div class="col-md-6 text-center card-container">
                    <p class="mb-2">Yumeko Cards:</p>
                    <div id="dealer-hand" class="card-group mb-4"></div>

                    <p class="mb-2">Your Cards:</p>
                    <div id="player-hand" class="card-group mb-4"></div>
                </div>
            </div>
        </div>


        <!-- Button Area -->
        <div class="container" id="actions">
            <div class="container-fluid container-bawah">
                <div class="row justify-content-center">
                    <div class="col-auto">
                        <button id="hold-btn" type="button" class="btn btn-danger">Hold a Card</button>
                    </div>
                    <div class="col-auto">
                        <button id="take-btn" type="button" class="btn btn-warning">Take a Card</button>
                    </div>
                    <div class="col-auto">
                        <button id="start-btn" type="button" class="btn btn-success">Start Game</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Area Sum dan Bet -->
        <div class="right-container">
            <div class="row-cols-auto col-md-12 justify-content-center">
                <div class="col-auto text-center">
                    <p>Yumeko Sums:</p>
                    <p id="dealer-total">0</p>
                </div>
                <div class="col-auto text-center">
                    <p>Your Sums:</p>
                    <p id="player-total">0</p>
                </div>
                <div class="col-auto text-center">
                    <p>Bet:</p>
                    <p>$<span id="current-bet">0</span></p>
                </div>
            </div>
        </div>

        <!-- Modal Bet -->
        <div class="modal fade" id="betModal" tabindex="-1" aria-labelledby="betModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="betModalLabel">Place Your Bet</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>Please enter your bet amount (Minimum: $100)</p>
                        <input type="number" id="bet-amount-modal" class="form-control" placeholder="Bet Amount" min="100">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" id="confirm-bet-btn">Confirm Bet</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Audio Background -->
        <audio id="background-audio" src="sounds/kakegurui_backsound.mp3" autoplay loop></audio>

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Link JS -->
    <script src="script.js"></script>
</body>
</html>
